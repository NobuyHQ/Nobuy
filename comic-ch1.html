<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$NOBUY - Chapter 01: The Beginning</title>
    <style>
        :root {
            --green: #00C805;
            --green-glow: rgba(0, 200, 5, 0.3);
            --bg-dark: #08080a;
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .reader-nav {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(8, 8, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .btn-back {
            color: var(--green);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid var(--green);
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(0, 200, 5, 0.1);
        }

        /* Switch Mode Toggle */
        .mode-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 3px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #a1a1aa;
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: var(--green);
            color: #000;
        }

        /* Main Container */
        .comic-wrapper {
            width: 100%;
            max-width: 700px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. MODE WEBTOON (SCROLL DOWN) */
        .mode-webtoon {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .mode-webtoon img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 2. MODE SLIDE (PAGINATION) */
        .mode-slide {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .slide-img-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .slide-img-container img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Controls untuk Mode Slide */
        .slide-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            padding: 0 10px;
        }

        .ctrl-btn {
            background: var(--green);
            color: #000;
            border: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .ctrl-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .page-counter {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--green);
            letter-spacing: 1px;
        }

        /* Footer */
        .reader-footer {
            width: 100%;
            max-width: 700px;
            padding: 30px 20px;
            text-align: center;
            border-top: 1px solid var(--card-border);
            margin-top: 20px;
        }

        .btn-share {
            background: var(--green);
            color: #000;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            margin-top: 12px;
            font-size: 0.85rem;
            box-shadow: 0 0 15px var(--green-glow);
        }
    </style>
</head>
<body>

    <!-- NAVIGASI ATAS -->
    <nav class="reader-nav">
        <a href="index.html" class="btn-back">← Home</a>

        <!-- Switch Mode Toggle -->
        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-webtoon" onclick="switchMode('webtoon')">Scroll</button>
            <button class="mode-btn" id="btn-slide" onclick="switchMode('slide')">Slide</button>
        </div>
    </nav>

    <div class="comic-wrapper">
        
        <!-- 1. TAMPILAN WEBTOON (SCROLL DOWN) -->
        <div id="webtoon-view" class="mode-webtoon">
            <img src="images/cover.png" alt="Cover">
            <img src="images/page1.png" alt="Page 1">
            <img src="images/page2.png" alt="Page 2">
            <img src="images/page3.png" alt="Page 3">
            <img src="images/page4.png" alt="Page 4">
            <img src="images/page5.png" alt="Page 5">
            <img src="images/page6.png" alt="Page 6">
            <img src="images/page7.png" alt="Page 7">
            <img src="images/page8.png" alt="Page 8">
        </div>

        <!-- 2. TAMPILAN SLIDE (PER HALAMAN) -->
        <div id="slide-view" class="mode-slide">
            <div class="slide-img-container">
                <img id="current-slide-img" src="images/cover.png" alt="Comic Slide">
            </div>

            <!-- Kontrol Navigasi Halaman -->
            <div class="slide-controls">
                <button class="ctrl-btn" id="prev-btn" onclick="changePage(-1)">← Prev</button>
                <span class="page-counter" id="page-num">1 / 9</span>
                <button class="ctrl-btn" id="next-btn" onclick="changePage(1)">Next →</button>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="reader-footer">
            <h3 style="font-size: 1rem; color: #fff;">END OF CHAPTER 01</h3>
            <p style="color: #a1a1aa; font-size: 0.8rem; margin-top: 4px;">Enjoyed the story? Share it with the community!</p>
            <a href="https://x.com/NobuyHQ" target="_blank" class="btn-share">Discuss on Twitter (X)</a>
        </footer>

    </div>

    <!-- LOGIKA JAVASCRIPT UNTUK SWITCH MODE & SLIDER -->
    <script>
        // Daftar seluruh file gambar PNG (1 Sampul + 8 Halaman)
        const pages = [
            "images/cover.png",
            "images/page1.png",
            "images/page2.png",
            "images/page3.png",
            "images/page4.png",
            "images/page5.png",
            "images/page6.png",
            "images/page7.png",
            "images/page8.png"
        ];

        let currentPageIndex = 0;

        function switchMode(mode) {
            const webtoonView = document.getElementById('webtoon-view');
            const slideView = document.getElementById('slide-view');
            const btnWebtoon = document.getElementById('btn-webtoon');
            const btnSlide = document.getElementById('btn-slide');

            if (mode === 'webtoon') {
                webtoonView.style.display = 'flex';
                slideView.style.display = 'none';
                btnWebtoon.classList.add('active');
                btnSlide.classList.remove('active');
            } else {
                webtoonView.style.display = 'none';
                slideView.style.display = 'flex';
                btnSlide.classList.add('active');
                btnWebtoon.classList.remove('active');
                updateSlide();
            }
        }

        function changePage(direction) {
            currentPageIndex += direction;

            if (currentPageIndex < 0) currentPageIndex = 0;
            if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1;

            updateSlide();
        }

        function updateSlide() {
            const imgElement = document.getElementById('current-slide-img');
            const pageNumElement = document.getElementById('page-num');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            imgElement.src = pages[currentPageIndex];
            pageNumElement.innerText = `${currentPageIndex + 1} / ${pages.length}`;

            prevBtn.disabled = (currentPageIndex === 0);
            nextBtn.disabled = (currentPageIndex === pages.length - 1);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

</body>
</html>
