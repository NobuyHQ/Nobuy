<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$NOBUY - Steal from the brokers, give to the degen</title>
    <style>
        :root {
            --green: #00C805;
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --text-light: #ffffff;
            --text-gray: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            text-align: center;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* Hero Section */
        .logo-title {
            color: var(--green);
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 200, 5, 0.4);
        }

        .tagline {
            font-size: clamp(1rem, 3.5vw, 1.25rem);
            color: var(--text-gray);
            margin-bottom: 35px;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--green);
            color: #000000;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 200, 5, 0.3);
            display: inline-block;
            font-size: 1rem;
            width: 100%;
            max-width: 220px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 200, 5, 0.6);
        }

        .btn-outline {
            background: transparent;
            color: var(--green);
            border: 2px solid var(--green);
        }

        .btn-outline:hover {
            background-color: rgba(0, 200, 5, 0.1);
        }

        /* Contract Address Box */
        .ca-box {
            background-color: var(--card-bg);
            border: 1px solid var(--green);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 40px;
            box-shadow: inset 0 0 10px rgba(0, 200, 5, 0.1);
        }

        .ca-title {
            color: var(--green);
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .ca-code {
            color: #ffffff;
            font-family: monospace;
            font-size: clamp(0.85rem, 3vw, 1.05rem);
            word-break: break-all;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            display: block;
        }

        /* Tokenomics Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px 20px;
            border-radius: 16px;
            border: 1px solid #222222;
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: var(--green);
        }

        .card h3 {
            color: var(--green);
            margin-bottom: 8px;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .card p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: var(--text-gray);
            font-size: 0.85rem;
        }

        /* Responsive Adjustments for Mobile */
        @media (max-width: 480px) {
            .btn {
                max-width: 100%;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Hero Section -->
        <h1 class="logo-title">$NOBUY</h1>
        <p class="tagline">No fee. No mercy.<br>Steal from the brokers, give to the degen.</p>

        <!-- CTA Buttons -->
        <div class="btn-group">
            <a href="https://x.com/NobuyHQ" target="_blank" class="btn">Join Twitter (X)</a>
            <a href="#" class="btn btn-outline">Buy $NOBUY</a>
        </div>

        <!-- Contract Address -->
        <div class="ca-box">
            <div class="ca-title">Contract Address (CA)</div>
            <span class="ca-code" id="ca">TBA (To Be Announced)</span>
        </div>

        <!-- Tokenomics Section -->
        <div class="grid">
            <div class="card">
                <h3>0%</h3>
                <p>Buy / Sell Tax</p>
            </div>
            <div class="card">
                <h3>100%</h3>
                <p>Liquidity Burned</p>
            </div>
            <div class="card">
                <h3>1B</h3>
                <p>Total Supply</p>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            &copy; $NOBUY Community. All rights reserved.
        </footer>
    </div>

</body>
</html>
